    <style>
        /* ============================================
           ALEZIFY OS — ULTRA EDITION
           ============================================ */
        :root {
            --primary: #0E0D3C;
            --primary-2: #15143f;
            --secondary: #D3F7FD;
            --accent: #E2B2FF;
            --white: #FFFFFF;
            --yellow: #FFD166;
            --green: #06D6A0;
            --red: #EF476F;
            --orange: #F78C6B;
            --font-main: 'Trebuchet MS', 'Comic Sans MS', sans-serif;
            --font-display: 'Arial Rounded MT Bold', 'Helvetica Rounded', sans-serif;
            --radius: 20px;
            --transition: all 0.3s ease;
            --glow-accent: 0 0 25px rgba(226,178,255,0.45);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-main);
            background-color: var(--primary);
            color: var(--white);
            line-height: 1.6;
            overflow-x: hidden;
        }
        ::selection { background: var(--yellow); color: var(--primary); }
        :focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; border-radius: 6px; }

        h1, h2, h3, h4 { font-family: var(--font-display); font-weight: bold; }

        /* --- BACKGROUND PARTICLES --- */
        #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.55; }
        .hero, .section, .fs-section, .guide-section, footer, nav { position: relative; z-index: 1; }

        /* --- BOOT SCREEN --- */
        #boot {
            position: fixed; inset: 0; z-index: 5000; background: radial-gradient(circle at 50% 40%, #1a1854 0%, #05051a 70%);
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 1.2rem;
            transition: opacity 0.7s ease, visibility 0.7s; cursor: pointer;
        }
        #boot.done { opacity: 0; visibility: hidden; }
        #boot .boot-logo { font-family: var(--font-display); font-size: 3rem; color: var(--secondary); letter-spacing: 2px; }
        #boot .boot-logo span { color: var(--accent); }
        #boot .boot-bar-wrap { width: min(420px, 80vw); height: 14px; background: rgba(211,247,253,0.12); border-radius: 20px; border: 2px solid var(--accent); overflow: hidden; }
        #boot .boot-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--yellow), var(--accent), var(--green)); border-radius: 20px; transition: width 0.25s ease; }
        #boot .boot-msg { font-family: monospace; font-size: 0.85rem; color: var(--secondary); opacity: 0.85; min-height: 1.4em; }
        #boot .boot-hint { font-size: 0.75rem; color: var(--accent); opacity: 0.7; }

        /* --- PROGRESS BAR --- */
        #progress-bar {
            position: fixed; top: 0; left: 0; height: 5px;
            background: linear-gradient(90deg, var(--yellow), var(--accent), var(--green));
            width: 0%; z-index: 2000; transition: width 0.1s ease;
        }

        /* --- NAV --- */
        nav {
            position: fixed; top: 0; width: 100%; padding: 0.8rem 3%;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(14, 13, 60, 0.97); backdrop-filter: blur(10px);
            z-index: 1000; border-bottom: 3px solid var(--accent);
        }
        .logo { font-family: var(--font-display); font-size: 1.5rem; color: var(--secondary); text-decoration: none; }
        .logo span { color: var(--accent); }
        nav ul { display: flex; list-style: none; gap: 0.5rem; flex-wrap: wrap; }
        nav a { color: var(--secondary); text-decoration: none; font-weight: bold; transition: var(--transition); font-size: 0.75rem; padding: 0.25rem 0.4rem; border-radius: 5px; }
        nav a:hover, nav a.active { color: var(--primary); background: var(--yellow); }
        .nav-tools { display: flex; gap: 0.5rem; align-items: center; }
        .tool-btn {
            background: transparent; border: 2px solid var(--secondary); color: var(--secondary);
            border-radius: 10px; padding: 0.3rem 0.6rem; cursor: pointer; font-size: 1rem;
            transition: var(--transition); line-height: 1;
        }
        .tool-btn:hover { background: var(--secondary); color: var(--primary); }
        .tool-btn.speaking { background: var(--yellow); color: var(--primary); animation: pulse-reader 0.6s infinite alternate; }
        @keyframes pulse-reader { from { transform: scale(1); } to { transform: scale(1.08); } }
        #hamburger { display: none; }
        #mobile-menu {
            position: fixed; top: 58px; left: 0; right: 0; z-index: 999;
            background: rgba(14,13,60,0.98); border-bottom: 3px solid var(--accent);
            display: none; flex-direction: column; padding: 1rem; gap: 0.3rem;
            max-height: 70vh; overflow-y: auto;
        }
        #mobile-menu.open { display: flex; }
        #mobile-menu a { color: var(--secondary); text-decoration: none; font-weight: bold; padding: 0.5rem; border-radius: 8px; }
        #mobile-menu a:hover { background: var(--yellow); color: var(--primary); }

        /* --- HERO --- */
        .hero {
            min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; padding: 90px 5% 40px;
            background: radial-gradient(circle at center, rgba(226, 178, 255, 0.25) 0%, transparent 70%);
            position: relative;
        }
        .hero h1 { font-size: 4rem; margin-bottom: 0.5rem; color: var(--yellow); text-shadow: 4px 4px 0px var(--accent); }
        .hero h2 { font-size: 2.2rem; color: var(--secondary); margin-bottom: 1.5rem; }
        .hero p { font-size: 1.2rem; max-width: 800px; color: var(--secondary); margin-bottom: 2rem; }
        .floating-emoji { font-size: 3rem; position: absolute; animation: float 4s infinite ease-in-out; z-index: 1; user-select: none; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-30px) rotate(10deg); } }

        .hero-stats { display: flex; gap: 0.8rem; flex-wrap: wrap; justify-content: center; margin-bottom: 2rem; }
        .stat-chip {
            background: rgba(14,13,60,0.85); border: 2px solid var(--accent); border-radius: 50px;
            padding: 0.5rem 1.1rem; font-weight: bold; font-size: 0.85rem; color: var(--secondary);
            box-shadow: var(--glow-accent); backdrop-filter: blur(6px);
        }
        .stat-chip b { color: var(--yellow); }

        .btn { padding: 1rem 2.5rem; background-color: var(--accent); color: var(--primary); border: none; border-radius: 50px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: var(--transition); font-family: var(--font-display); box-shadow: 0 6px 0 var(--primary); }
        .btn:hover { transform: translateY(-4px); box-shadow: 0 10px 0 var(--primary); }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--primary); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn-secondary { background: transparent; border: 3px solid var(--secondary); color: var(--secondary); box-shadow: none; }
        .btn-secondary:hover { background: var(--secondary); color: var(--primary); box-shadow: none; }

        /* --- SCROLL REVEAL --- */
        .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.7s ease, transform 0.7s ease; }
        .reveal.visible { opacity: 1; transform: none; }

        /* --- SECTIONS --- */
        .section { padding: 5rem 4%; display: flex; flex-direction: column; align-items: center; position: relative; min-height: 70vh; }
        .section-alt { background: rgba(226, 178, 255, 0.05); }
        .section-title { font-size: 2.5rem; color: var(--secondary); margin-bottom: 0.5rem; text-align: center; }
        .section-subtitle { text-align: center; color: var(--white); opacity: 0.9; margin-bottom: 2.5rem; max-width: 800px; font-size: 1.1rem; }
        .highlight { color: var(--yellow); font-weight: bold; }

        /* ============================================
           START-HERE GUIDE PAGE
           ============================================ */
        .guide-section { padding: 4rem 4% 3rem; background: linear-gradient(180deg, rgba(226,178,255,0.06) 0%, rgba(14,13,60,0) 100%); }
        .guide-progress-bar {
            background: rgba(255,209,102,0.12); border: 2px solid var(--yellow);
            border-radius: 50px; padding: 0.55rem 1.4rem; margin-bottom: 1.8rem;
            font-weight: bold; color: var(--yellow); font-size: 0.95rem;
            box-shadow: 0 0 20px rgba(255,209,102,0.2);
        }
        .guide-progress-bar b { color: var(--white); }
        .guide-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; width: 100%; max-width: 1100px; }
        .guide-card {
            background: linear-gradient(135deg, rgba(226,178,255,0.10), rgba(211,247,253,0.03));
            border: 3px solid var(--secondary); border-radius: var(--radius);
            padding: 1rem; display: flex; gap: 0.8rem; align-items: flex-start;
            position: relative; transition: var(--transition); cursor: pointer; text-align: left;
        }
        .guide-card:hover { border-color: var(--yellow); transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.4); }
        .guide-card.visited { border-color: var(--green); background: linear-gradient(135deg, rgba(6,214,160,0.15), rgba(211,247,253,0.03)); }
        .guide-card.visited::after { content: '✅'; position: absolute; top: 8px; right: 12px; font-size: 1.2rem; }
        .guide-num { background: var(--accent); color: var(--primary); width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-family: var(--font-display); flex-shrink: 0; font-size: 1rem; }
        .guide-icon { font-size: 2rem; flex-shrink: 0; line-height: 1; }
        .guide-body h3 { color: var(--yellow); font-size: 1rem; margin-bottom: 0.3rem; }
        .guide-body p { font-size: 0.82rem; color: var(--secondary); line-height: 1.45; }
        .guide-body p strong { color: var(--white); }

        .bouncing-arrow {
            text-align: center; color: var(--yellow); font-size: 1rem; font-weight: bold;
            margin: 2rem auto; padding: 0.9rem 1.6rem; border: 2px dashed var(--yellow);
            border-radius: 50px; background: rgba(255,209,102,0.08);
            animation: bounceDown 1.4s infinite; max-width: 460px; width: 100%;
            display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
        }
        @keyframes bounceDown { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(10px); } }

        .instruction-banner {
            display: flex; align-items: center; justify-content: center; gap: 0.7rem;
            background: linear-gradient(90deg, rgba(255,209,102,0.15), rgba(226,178,255,0.15));
            border: 2px solid var(--yellow); border-radius: 50px; padding: 0.65rem 1.4rem;
            margin-bottom: 1.8rem; font-size: 0.9rem; color: var(--white); text-align: center;
            max-width: 820px; font-weight: bold; box-shadow: 0 0 20px rgba(255,209,102,0.2); line-height: 1.4;
        }
        .instruction-banner .ib-arrow { font-size: 1.3rem; animation: pointLeftRight 1.2s infinite alternate; flex-shrink: 0; }
        @keyframes pointLeftRight { from { transform: translateX(-4px); } to { transform: translateX(4px); } }

        .next-section-cta {
            display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
            background: rgba(255,209,102,0.08); border: 2px dashed var(--yellow);
            border-radius: 50px; padding: 0.8rem 1.6rem; text-decoration: none; color: var(--yellow);
            margin-top: 2.5rem; transition: var(--transition); font-size: 0.8rem;
            max-width: 360px; width: 100%; text-align: center;
        }
        .next-section-cta:hover { background: var(--yellow); color: var(--primary); transform: translateY(-3px); box-shadow: 0 10px 25px rgba(255,209,102,0.3); }
        .next-section-cta strong { font-family: var(--font-display); font-size: 1.05rem; }
        .next-section-cta .nsc-arrow { font-size: 1.3rem; animation: bounceDown 1.2s infinite; }
        .post-factory-cta { text-align: center; padding: 1.2rem; background: rgba(226,178,255,0.05); border-top: 1px dashed rgba(211,247,253,0.2); display: flex; justify-content: center; }

        .hero-actions { display: flex; gap: 0.8rem; flex-wrap: wrap; justify-content: center; margin-bottom: 2rem; }
        .hero-scroll-hint { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; color: var(--yellow); font-size: 0.85rem; font-weight: bold; opacity: 0.85; margin-top: 1rem; }
        .hero-arrow { font-size: 1.6rem; animation: bounceDown 1.4s infinite; }
